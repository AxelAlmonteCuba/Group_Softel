# ==============================================================================
# docker-compose.dev.yml — Entorno LOCAL de Desarrollo Softel
# Solo MySQL + backend con hot-reload (sin Caddy, sin produccion)
# Uso: docker compose -f docker-compose.dev.yml up
# ==============================================================================

services:
  # ============================================================================
  # MySQL 8.0 para desarrollo local
  # ============================================================================
  mysql-local:
    image: mysql:8.0
    container_name: softel_mysql_local
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: SoftelRoot2026!
      MYSQL_DATABASE: softel_dev
      MYSQL_USER: softel_app
      MYSQL_PASSWORD: SoftelApp2026!
    volumes:
      - softel_mysql_local_data:/var/lib/mysql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ports:
      # Expuesto en localhost para conectar con TablePlus / DBeaver
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pSoftelRoot2026! || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # Backend NestJS con hot-reload (modo desarrollo)
  # ============================================================================
  backend-local:
    image: node:20-alpine
    container_name: softel_backend_local
    working_dir: /workspace
    restart: unless-stopped
    depends_on:
      mysql-local:
        condition: service_healthy
    environment:
      - ENTORNO=desarrollo
      - PUERTO=3000
      - URL_API=http://localhost:3000
      - PREFIJO_GLOBAL=api/v1
      - DB_HOST=mysql-local
      - DB_PORT=3306
      - DB_NOMBRE=softel_dev
      - DB_USUARIO=softel_app
      - DB_CLAVE=SoftelApp2026!
      - DB_SINCRONIZAR=true
      - DB_LOGGING=true
      - JWT_SECRET=dev_secret_local_no_usar_en_produccion
      - JWT_EXPIRACION=8h
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_RUTA=./uploads
      - STORAGE_PUBLIC_URL=http://localhost:3000/uploads
      - MAX_TAMANO_IMAGEN_MB=10
      - CALIDAD_WEBP=80
    volumes:
      # Monta el código fuente para hot-reload con nodemon
      - .:/workspace
      - /workspace/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run start:dev"

volumes:
  softel_mysql_local_data:
